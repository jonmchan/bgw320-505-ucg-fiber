# Installed path: /etc/wpa_supplicant/wpa_supplicant-wired-eth6.0.conf
# chmod 600. Replace <id> with the id in the extraction-tool filenames.
# identity is the Internet (ONT) MAC printed by that tool, colons included.
#
# Debian 11 / OpenSSL 1.1: leave the file like this.
# Debian 13 / OpenSSL 3: reinstall-wpa.sh inserts this GLOBAL line above
# network={ when it is missing:
#   openssl_ciphers=DEFAULT@SECLEVEL=0
# That line does not work inside network={} on wpa_supplicant 2.10.
ctrl_interface=DIR=/var/run/wpa_supplicant
eapol_version=1
ap_scan=0
fast_reauth=1
network={
        ca_cert="/etc/wpa_supplicant/certs/CA_<id>.pem"
        client_cert="/etc/wpa_supplicant/certs/Client_<id>.pem"
        eap=TLS
        eapol_flags=0
        identity="XX:XX:XX:XX:XX:XX"
        key_mgmt=IEEE8021X
        phase1="allow_canned_success=1"
        private_key="/etc/wpa_supplicant/certs/PrivateKey_PKCS1_<id>.pem"
}
